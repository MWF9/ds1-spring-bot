spring.application.name=spring-ds1

# --- PostgreSQL (override with environment variables if needed) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ds1_stock}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- App ---
server.port=8080
# Insert demo data on first start (only if the database is empty)
app.seed.enabled=true
